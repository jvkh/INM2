services:
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./logs:/logs
    ports:
      - "3000:80"

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    command: ["python", "-m", "collector.main"]
    expose:
      - "8001"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INM2_LOG_DIR: /logs
    volumes:
      - ./databases:/app/databases
      - ./logs:/logs
      - ./databases/geoip:/geoip:ro

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      COLLECTOR_CONTROL_URL: http://collector:8001
      INM2_LOG_DIR: /logs
    restart: unless-stopped
    volumes:
      - ./databases:/app/databases
      - ./logs:/logs
    ports:
      - "8000:8000"
